
name: Secure Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pytest

      - name: Validate Python files
        run: |
          python -m compileall -q app.py models.py

      - name: Run automated tests
        env:
          SECRET_KEY: ${{ secrets.CI_FLASK_SECRET_KEY }}
        run: |
          python -m pytest -q

      - name: Run Bandit security scan
        run: |
          python -m bandit -r app.py models.py

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt