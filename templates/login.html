<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Secure Dashboard Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            max-width: 85%;
            box-shadow: 0 4px 15px #00000015;
        }
        h2 { color: #1e293b; text-align: center; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin-top: 16px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Delivery Defect Dashboard</h2>
        <p>Secure Application Login</p>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">    
            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" maxlength="50"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
