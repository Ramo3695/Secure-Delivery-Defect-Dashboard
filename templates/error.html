<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Application Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .error-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 { color: #1e293b; }

        p { color: #475569; }

        a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>Application Error</h1>

        <p>{{ message }}</p>

        <a href="{{ url_for('home') }}">
            Return to Home
        </a>
    </div>
</body>
</html>
